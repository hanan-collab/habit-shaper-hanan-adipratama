  </g>
  <g transform="translate(500 300)">
    <rect y="10" width="96" height="96" rx="22" fill="#C96C65"/>
    <rect width="96" height="90" rx="22" fill="#FFFFFF" stroke="#DFB7B3" stroke-width="3"/>
    <path d="M25 59h22M25 44h39M25 29h52" fill="none" stroke="#A93F3B" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g transform="translate(650 241)">
    <rect y="10" width="70" height="70" rx="18" fill="#C96C65"/>
    <rect width="70" height="64" rx="18" fill="#FFFFFF" stroke="#DFB7B3" stroke-width="3"/>
    <path d="M19 42h15M19 31h27M19 20h37" fill="none" stroke="#A93F3B" stroke-width="6" stroke-linecap="round"/>

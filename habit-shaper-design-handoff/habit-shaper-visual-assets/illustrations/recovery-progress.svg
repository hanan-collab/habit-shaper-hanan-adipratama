<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Recovery keeps progress visible</title>
  <desc id="desc">An abstract calm path reconnects a sequence of raised progress blocks after a pause.</desc>

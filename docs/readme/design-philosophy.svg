<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Habit Shaper design philosophy</title>
  <desc id="desc">Small actions create visible progress through momentum, recovery, and clear interaction.</desc>
  <rect width="1440" height="810" fill="#fff8f6"/>
  <path d="M0 640h360V480h360V320h360V160h360v650H0z" fill="#f8dedb"/>
  <path d="M720 810V650h240V490h240V330h240" fill="none" stroke="#dfb7b3" stroke-width="3"/>
  <g transform="translate(112 92)">
    <path d="M0 64V0h64v32H32v32z" fill="#a93f3b"/>
    <text x="88" y="46" fill="#261f1f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="3">HABIT SHAPER</text>
  </g>
  <text x="112" y="282" fill="#261f1f" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="-4">SMALL ACTIONS.</text>
  <text x="112" y="382" fill="#a93f3b" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="-4">VISIBLE PROGRESS.</text>
  <text x="116" y="450" fill="#776969" font-family="Arial, Helvetica, sans-serif" font-size="25">Shape the next step, learn from the last one, and keep moving.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(112 568)">
      <circle cx="20" cy="20" r="20" fill="#a93f3b"/>
      <text x="20" y="27" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">1</text>
      <text x="54" y="15" fill="#261f1f" font-size="22" font-weight="700">MOMENTUM OVER PRESSURE</text>
      <text x="54" y="44" fill="#776969" font-size="18">A small repeatable step beats a perfect plan.</text>
    </g>
    <g transform="translate(112 672)">
      <circle cx="20" cy="20" r="20" fill="#e67a72"/>
      <text x="20" y="27" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">2</text>
      <text x="54" y="15" fill="#261f1f" font-size="22" font-weight="700">RECOVERY IS DATA</text>
      <text x="54" y="44" fill="#776969" font-size="18">A relapse informs the next action. It does not erase progress.</text>
    </g>
    <g transform="translate(760 568)">
      <circle cx="20" cy="20" r="20" fill="#261f1f"/>
      <text x="20" y="27" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">3</text>
      <text x="54" y="15" fill="#261f1f" font-size="22" font-weight="700">INTERACTION EARNS ELEVATION</text>
      <text x="54" y="44" fill="#776969" font-size="18">Depth and motion clarify actions, state, and feedback.</text>
    </g>
  </g>
</svg>

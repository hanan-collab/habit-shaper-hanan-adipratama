<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Milestone background response</title>
  <desc id="desc">A deep-red milestone surface expands while the raised step mark lights up.</desc>
  <style>
    .surface{transform-origin:320px 180px;animation:expand .42s cubic-bezier(.2,.8,.2,1) both}
    .mark{transform-origin:490px 180px;animation:mark .42s .16s cubic-bezier(.2,.8,.2,1) both}
    .step{opacity:.18;animation:light .18s ease-out forwards}.s1{animation-delay:.38s}.s2{animation-delay:.5s}.s3{animation-delay:.62s}
    .accent{transform-origin:left;transform:scaleX(0);animation:rule .24s .62s ease-out forwards}
    @keyframes expand{from{transform:scaleX(.76);opacity:0}}
    @keyframes mark{from{transform:translateY(16px) scale(.9);opacity:0}}
    @keyframes light{to{opacity:1}}@keyframes rule{to{transform:scaleX(1)}}
    @media(prefers-reduced-motion:reduce){.surface,.mark,.step,.accent{animation:none;opacity:1;transform:none}}
  </style>
  <rect class="surface" x="12" y="12" width="616" height="336" rx="36" fill="#A93F3B"/>
  <path class="accent" d="M72 280h250" stroke="#E67A72" stroke-width="7" stroke-linecap="round"/>
  <g class="mark">
    <rect x="420" y="119" width="140" height="140" rx="34" fill="#7F2F2C"/>
    <rect x="420" y="103" width="140" height="140" rx="34" fill="#A93F3B" stroke="#FFFFFF" stroke-width="6"/>
    <path class="step s1" d="M452 201h31" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path class="step s2" d="M452 174h61" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path class="step s3" d="M452 147h83" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>

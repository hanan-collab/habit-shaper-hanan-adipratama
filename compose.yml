services:
  db:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-habit_shaper}
      MYSQL_USER: ${MYSQL_USER:-habit_shaper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scaffold_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-scaffold_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      target: production
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: mysql://${MYSQL_USER:-habit_shaper}:${MYSQL_PASSWORD:-scaffold_password}@db:3306/${MYSQL_DATABASE:-habit_shaper}?connect_timeout=5&pool_timeout=5
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    init: true
    environment:
      APP_URL: http://app:3000
      DATABASE_URL: mysql://${MYSQL_USER:-habit_shaper}:${MYSQL_PASSWORD:-scaffold_password}@db:3306/${MYSQL_DATABASE:-habit_shaper}?connect_timeout=5&pool_timeout=5
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  mysql_data:
